<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Helper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Financial Helper</h1>
        <p class="subtitle">
            Calculate your savings goal and manage your money.
        </p>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button id="calculatorTab" class="tab active">
                Calculator
            </button>

            <button id="savedTab" class="tab">
                Saved Data
            </button>
        </div>


        <!-- ==================== -->
        <!-- Calculator Section -->
        <!-- ==================== -->

        <div id="calculatorSection">

            <div class="form-card">

                <label for="income">Monthly Income ($)</label>
                <input 
                    type="number" 
                    id="income" 
                    placeholder="Enter your monthly income"
                    min="0"
                >

                <label for="target">Savings Target ($)</label>
                <input 
                    type="number" 
                    id="target" 
                    placeholder="Enter your savings target"
                    min="0"
                >

                <label for="months">Target Period</label>
                <select id="months">
                    <option value="1">1 Month</option>
                    <option value="3">3 Months</option>
                    <option value="6">6 Months</option>
                    <option value="12">12 Months</option>
                </select>

                <div class="button-group">
                    <button id="calculateBtn">
                        Calculate
                    </button>

                    <button id="saveBtn">
                        Save Data
                    </button>
                </div>

            </div>


            <!-- Result Box -->
            <div id="result" class="result-box">

                <h2>Result</h2>

                <p id="resultText">
                    Enter your information and click Calculate.
                </p>

            </div>

        </div>


        <!-- ==================== -->
        <!-- Saved Data Section -->
        <!-- ==================== -->

        <div id="savedSection" class="hidden">

            <div class="saved-header">

                <h2>📂 Saved Data</h2>

                <button id="clearAllBtn" class="clear-all-btn">
                    Clear All Data
                </button>

            </div>

            <!-- Saved records will appear here -->
            <div id="savedList">
                <p class="no-data">
                    No saved data yet.
                </p>
            </div>

        </div>

    </div>


    <!-- Saved Date at Bottom -->
    <div id="savedStatus" class="saved-status">
        No data saved yet.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
